[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-validation-lab"
version = "0.1.0"
description = "A reproducible validation gate for JSONL telemetry datasets"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dipen Patel"}]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
validate-dataset = "validation_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
