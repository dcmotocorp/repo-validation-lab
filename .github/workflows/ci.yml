name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m validation_lab.cli examples/events.jsonl examples/manifest.json
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t repo-validation-lab .
      - run: docker run --rm -v "$PWD/examples:/data:ro" repo-validation-lab /data/events.jsonl /data/manifest.json
